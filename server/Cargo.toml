[package]
name = "aspire-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }
